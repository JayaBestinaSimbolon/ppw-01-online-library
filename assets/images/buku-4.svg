<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Cover -->
  <rect width="300" height="420" rx="10" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Spine decoration -->
  <rect x="0" y="0" width="22" height="420" rx="4" fill="rgba(0,0,0,0.22)"/>
  <line x1="22" y1="0" x2="22" y2="420" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Top Badge / Category -->
  <rect x="42" y="35" width="140" height="26" rx="6" fill="rgba(255,255,255,0.18)"/>
  <text x="50" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DATABASE</text>

  <!-- Title Text -->
  <text x="42" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800" line-height="1.2">
    <tspan x="42" dy="0">Sistem Basis</tspan>
    <tspan x="42" dy="28">Data</tspan>
  </text>

  <!-- Graphic / Icon Box -->
  <g transform="translate(42, 190)">
    <circle cx="45" cy="45" r="45" fill="rgba(255,255,255,0.12)"/>
    <path d="M25 55 L45 28 L65 55 Z" fill="rgba(255,255,255,0.3)"/>
    <circle cx="45" cy="42" r="14" fill="#ffffff" opacity="0.9"/>
    <rect x="100" y="25" width="110" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="100" y="42" width="80" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="100" y="59" width="95" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Bottom Brand -->
  <line x1="42" y1="360" x2="260" y2="360" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="42" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" opacity="0.9">IT DEL DIGITAL LIBRARY</text>
  <text x="220" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" opacity="0.75">EDISI 2024</text>
</svg>