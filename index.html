<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Library System</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

  <!-- Header Aplikasi -->
  <header class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <i class="bi bi-journal-bookmark-fill fs-3"></i>
        <span>Online Library System</span>
      </a>
      <span class="navbar-text text-white-50 d-none d-md-inline">
        Sistem Katalog dan Peminjaman Buku Perpustakaan Sederhana
      </span>
    </div>
  </header>

  <main class="container py-4 flex-grow-1">
    <!-- Bagian 1: Pencarian Buku menggunakan HTTP GET -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h2 class="h5 card-title fw-bold mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-search text-primary"></i> Pencarian Buku
        </h2>
        <form id="searchForm" method="GET" action="index.html">
          <div class="row g-2">
            <div class="col-12 col-md-10">
              <div class="input-group">
                <span class="input-group-text bg-white text-muted">
                  <i class="bi bi-search"></i>
                </span>
                <input 
                  type="text" 
                  id="searchInput" 
                  name="q" 
                  class="form-control" 
                  placeholder="Ketik judul buku yang ingin dicari..." 
                  autocomplete="off"
                >
              </div>
            </div>
            <div class="col-12 col-md-2">
              <button type="submit" class="btn btn-primary w-100 fw-semibold">
                Search
              </button>
            </div>
          </div>
        </form>
        <div id="searchInfo" class="mt-2"></div>
      </div>
    </section>

    <!-- Bagian 2: Daftar Buku Koleksi Perpustakaan -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
        <h2 class="h5 card-title fw-bold mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-book text-primary"></i> Daftar Buku
        </h2>
        <span id="bookCountBadge" class="badge bg-primary rounded-pill px-3 py-2">0 Buku</span>
      </div>
      <div class="card-body p-4">
        <div id="bookList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
          <!-- Kartu buku akan di-render secara dinamis oleh script.js -->
        </div>
      </div>
    </section>

    <!-- Bagian 3: Formulir Peminjaman Buku -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3 border-bottom">
        <h2 class="h5 card-title fw-bold mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-pencil-square text-primary"></i> Formulir Peminjaman Buku
        </h2>
      </div>
      <div class="card-body p-4">
        <p class="text-muted small mb-3">
          Silakan isi data peminjam dan pilih buku yang berstatus <span class="badge bg-success-subtle text-success border border-success-subtle">Available</span>.
        </p>
        
        <div id="formAlert" class="alert" style="display: none;" role="alert"></div>

        <form id="borrowForm" novalidate>
          <div class="mb-3">
            <label for="borrowerName" class="form-label fw-semibold">Nama Peminjam <span class="text-danger">*</span></label>
            <input 
              type="text" 
              id="borrowerName" 
              name="borrowerName" 
              class="form-control" 
              placeholder="Masukkan nama lengkap peminjam"
              required
            >
            <div class="invalid-feedback d-block" id="nameError"></div>
          </div>

          <div class="mb-3">
            <label for="borrowerNim" class="form-label fw-semibold">NIM (Nomor Induk Mahasiswa) <span class="text-danger">*</span></label>
            <input 
              type="text" 
              id="borrowerNim" 
              name="borrowerNim" 
              class="form-control" 
              placeholder="Contoh: 12345678"
              required
            >
            <div class="invalid-feedback d-block" id="nimError"></div>
          </div>

          <div class="mb-3">
            <label for="bookSelect" class="form-label fw-semibold">Judul Buku <span class="text-danger">*</span></label>
            <select id="bookSelect" name="bookSelect" class="form-select" required>
              <option value="">-- Pilih Buku yang Tersedia --</option>
            </select>
            <div class="invalid-feedback d-block" id="bookError"></div>
          </div>

          <button type="submit" class="btn btn-success fw-semibold px-4">
            <i class="bi bi-check-circle me-1"></i> Pinjam Buku
          </button>
        </form>
      </div>
    </section>

    <!-- Bagian 4: Daftar Buku yang Sedang Dipinjam -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
        <h2 class="h5 card-title fw-bold mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-clock-history text-primary"></i> Daftar Buku yang Sedang Dipinjam
        </h2>
        <span id="borrowedCountBadge" class="badge bg-secondary rounded-pill px-3 py-2">0 Pinjaman</span>
      </div>
      <div class="card-body p-0">
        <div id="borrowedContainer">
          <!-- Tabel atau pesan kosong akan di-render secara dinamis oleh script.js -->
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-white border-top py-3 text-center text-muted mt-auto">
    <div class="container">
      <p class="mb-0 small">&copy; Online Library System - Tugas PPW-01</p>
    </div>
  </footer>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
